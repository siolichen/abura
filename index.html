    // Hide splash as soon as fonts are ready (independent of React mounting).
    (function(){
      function hideSplash(){
        var s = document.getElementById('splash');
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }
      if (document.fonts && document.fonts.ready) {
        Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r, 1500))]).then(()=>setTimeout(hideSplash, 200));
      } else {
        setTimeout(hideSplash, 1200);
      }
      // safety net — always remove after 3s
      setTimeout(hideSplash, 3000);
    })();

  <script>
    (function(){
      var el = document.getElementById('swipe-hint');
      if(!el) return;
      var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if(!coarse){ el.remove(); return; }   // swipe hint only makes sense on touch
      setTimeout(function(){ el.classList.add('show'); }, 350);
      setTimeout(function(){ el.classList.remove('show'); }, 3200);
      setTimeout(function(){ el.remove(); }, 3800);
    })();
